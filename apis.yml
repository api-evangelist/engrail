name: Engrail
description: 'Engrail Therapeutics is a clinical-stage biopharmaceutical company founded
  in 2019 and focused on precision neuroscience. The company develops innovative,
  precision-targeted small-molecule therapeutics aimed at the molecular mechanisms
  and neural circuits underlying nervous system disorders, combining internal discovery
  with strategic partnerships. Its pipeline includes candidates ENX-102, ENX-104,
  ENX-203, and ENX-205 for patients with devastating and life-limiting neurological
  conditions. Surfaced as a portfolio company of Norwest Venture Partners and profiled
  in the API Evangelist network; the company publishes no public developer/API surface.'
